services:
  db:
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "${CONTAINER_LOG_MAX_SIZE:-10m}"
        max-file: "${CONTAINER_LOG_MAX_FILES:-3}"

  app:
    image: scientificresearch:net10-pg-published
    build:
      context: .
      dockerfile: Dockerfile.published
    platform: ${APP_PLATFORM:-linux/amd64}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "${CONTAINER_LOG_MAX_SIZE:-10m}"
        max-file: "${CONTAINER_LOG_MAX_FILES:-3}"
