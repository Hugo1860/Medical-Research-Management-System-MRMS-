<!DOCTYPE html>
<html lang="zh-CN" style="height:100%"><head><meta charset="UTF-8"><title>科研绩效评价管理</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/IMIS/libs/bootstrap/css/bootstrap.min.css"><link rel="stylesheet" href="/IMIS/css/child_pages.css"><script src="/IMIS/libs/jquery-1.11.1.min.js"></script><script src="/IMIS/libs/bootstrap/js/bootstrap.min.js"></script><script src="/IMIS/js/main.js"></script><script src="/IMIS/js/get_connect/connect_http.js"></script><script src="/IMIS/js/科研办公/科研办公/科研评价管理.js"></script></head>
<body class="page-common" onload="IFrameResize()"><div class="main" style="padding:18px 24px"><div class="clearfix"><h4 class="title pull-left">科研绩效评价管理</h4><a class="btn btn-default pull-right" href="/IMIS/views/科研办公/科研办公/科研治理中心.html">返回治理中心</a></div><div id="message" class="alert" style="display:none"></div>
<div class="panel panel-default"><div class="panel-heading">评价规则</div><div class="panel-body"><form id="rule-form" class="form-inline"><input name="规则名称" class="form-control" placeholder="规则名称" required><input name="版本号" type="number" min="1" value="1" class="form-control" placeholder="版本"><input name="适用岗位" class="form-control" placeholder="适用岗位"><input name="适用学科" class="form-control" placeholder="适用学科"><select name="状态" class="form-control"><option>草稿</option><option>生效</option><option>停用</option></select><input name="评价周期" class="form-control" value="年度" placeholder="评价周期"><button class="btn btn-primary">保存规则</button></form></div><div class="table-responsive"><table class="table table-bordered table-striped" id="rules"><thead><tr><th>编号</th><th>规则名称</th><th>版本</th><th>适用岗位</th><th>适用学科</th><th>周期</th><th>状态</th></tr></thead><tbody><tr><td colspan="7">加载中…</td></tr></tbody></table></div></div>
<div class="panel panel-default"><div class="panel-heading">规则项</div><div class="panel-body"><form id="item-form" class="form-inline"><input name="规则编号" type="number" class="form-control" placeholder="规则编号" required><input name="项目代码" class="form-control" placeholder="项目代码" required><input name="项目名称" class="form-control" placeholder="项目名称" required><input name="权重" type="number" step="0.01" value="1" class="form-control" placeholder="权重"><input name="最高分" type="number" step="0.01" value="100" class="form-control" placeholder="最高分"><input name="证据类型" class="form-control" placeholder="证据类型"><button class="btn btn-default">保存规则项</button></form></div></div>
<div class="panel panel-info"><div class="panel-heading">生成、复核与奖励</div><div class="panel-body"><form id="generate-form" class="form-inline"><input name="人员编号" type="number" min="1" class="form-control" placeholder="人员编号" required><input name="规则编号" type="number" min="1" class="form-control" placeholder="规则编号" required><input name="评价年度" type="number" min="2000" class="form-control" placeholder="评价年度"><input name="周期开始日期" type="date" class="form-control" required><input name="周期结束日期" type="date" class="form-control" required><input name="结果摘要" class="form-control" placeholder="结果摘要"><button class="btn btn-primary">生成评价</button><textarea name="明细" class="form-control" rows="2" style="display:block;width:100%;margin-top:8px" placeholder='明细 JSON，例如 [{"规则项编号":1,"原始值":80,"证据类型":"论文","证据标题":"论文题目","核验状态":"已核验"}]' required></textarea></form><form id="review-form" class="form-inline" style="margin-top:8px"><input name="评价结果编号" type="number" min="1" class="form-control" placeholder="评价结果编号" required><select name="状态" class="form-control"><option>已发布</option><option>作废</option><option>待复核</option></select><input name="复核意见" class="form-control" placeholder="复核意见"><button class="btn btn-success">提交复核</button></form><form id="reward-form" class="form-inline" style="margin-top:8px"><input name="评价结果编号" type="number" min="1" class="form-control" placeholder="评价结果编号" required><input name="人员编号" type="number" min="1" class="form-control" placeholder="人员编号"><input name="奖励名称" class="form-control" placeholder="奖励名称" required><input name="奖励级别" class="form-control" placeholder="奖励级别"><input name="奖励金额" type="number" min="0" step="0.01" class="form-control" placeholder="奖励金额"><select name="状态" class="form-control"><option>待发放</option><option>已发放</option><option>已取消</option></select><button class="btn btn-warning">登记奖励</button></form></div></div>
<div class="panel panel-default"><div class="panel-heading clearfix">已发布评价结果与排名 <button id="export-detail" class="btn btn-info btn-sm pull-right">导出明细报告</button><button id="export" class="btn btn-success btn-sm pull-right" style="margin-right:6px">导出汇总 CSV</button><button id="load-ranking" class="btn btn-default btn-sm pull-right" style="margin-right:6px">刷新排名</button></div><div class="table-responsive"><table class="table table-bordered table-striped" id="ranking"><thead><tr><th>排名</th><th>姓名</th><th>岗位</th><th>学科</th><th>年度</th><th>总分</th><th>状态</th><th>规则</th></tr></thead><tbody><tr><td colspan="8">加载中…</td></tr></tbody></table></div></div>
<div class="panel panel-default"><div class="panel-heading">本人评价结果</div><div class="table-responsive"><table class="table table-bordered table-striped" id="results"><thead><tr><th>年度</th><th>规则</th><th>周期</th><th>总分</th><th>状态</th><th>复核意见</th></tr></thead><tbody><tr><td colspan="6">加载中…</td></tr></tbody></table></div></div>
<div class="panel panel-info"><div class="panel-heading">评价结果解释与申诉</div><div class="panel-body"><form id="detail-form" class="form-inline"><input name="评价结果编号" type="number" class="form-control" placeholder="评价结果编号" required><button class="btn btn-info">查看明细</button></form><pre id="detail-output" style="margin-top:10px;max-height:260px;overflow:auto">请输入评价结果编号。</pre><form id="appeal-form" style="margin-top:10px"><input name="评价结果编号" type="hidden"><textarea name="申诉理由" class="form-control" rows="2" placeholder="申诉理由" required></textarea><input name="期望处理" class="form-control" style="margin-top:6px" placeholder="期望处理"><textarea name="补充证据说明" class="form-control" rows="2" style="margin-top:6px" placeholder="补充证据说明"></textarea><button class="btn btn-warning" style="margin-top:6px">提交申诉</button></form></div></div>
</div></body></html>
