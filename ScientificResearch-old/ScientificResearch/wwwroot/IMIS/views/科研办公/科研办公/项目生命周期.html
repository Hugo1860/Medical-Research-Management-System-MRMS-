<!DOCTYPE html>
<html lang="zh-CN" style="height:100%"><head><meta charset="UTF-8"><title>项目生命周期管理</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/IMIS/libs/bootstrap/css/bootstrap.min.css"><link rel="stylesheet" href="/IMIS/css/child_pages.css"><script src="/IMIS/libs/jquery-1.11.1.min.js"></script><script src="/IMIS/libs/bootstrap/js/bootstrap.min.js"></script><script src="/IMIS/js/main.js"></script><script src="/IMIS/js/get_connect/connect_http.js"></script><script src="/IMIS/js/科研办公/科研办公/项目生命周期.js"></script></head>
<body class="page-common" onload="IFrameResize()"><div class="main" style="padding:18px 24px"><div class="clearfix"><h4 class="title pull-left">项目生命周期管理</h4><a class="btn btn-default pull-right" href="/IMIS/views/科研办公/科研办公/科研业务台账.html?module=y-approval">返回项目台账</a></div><div id="message" class="alert" style="display:none"></div>
<div class="panel panel-default"><div class="panel-heading">选择纵向立项项目</div><div class="panel-body form-inline"><input id="project-id" type="number" class="form-control" placeholder="纵向项目立项编号"><button id="load" class="btn btn-primary">加载生命周期档案</button><span id="project-summary" class="text-muted" style="margin-left:10px"></span></div></div>
<div class="panel panel-default"><div class="panel-heading">阶段启动条件预检查</div><div class="panel-body form-inline"><select id="preflight-stage" class="form-control"><option value="中检">项目中检</option><option value="变更">项目变更</option><option value="结题">项目结题</option></select><button id="preflight" class="btn btn-info">执行预检查</button></div><div class="table-responsive"><table class="table table-bordered table-striped" id="preflight-table"><thead><tr><th>检查项</th><th>结果</th><th>说明</th></tr></thead><tbody><tr><td colspan="3">请选择项目后执行预检查</td></tr></tbody></table></div></div>
<div class="row"><div class="col-md-6"><div class="panel panel-default"><div class="panel-heading">延期 / 暂停 / 终止申请</div><div class="panel-body"><form id="lifecycle-form"><select name="事件类型" class="form-control"><option>延期</option><option>暂停</option><option>终止</option></select><input name="新计划完成日期" type="date" class="form-control" style="margin-top:8px"><textarea name="申请原因" class="form-control" rows="3" style="margin-top:8px" placeholder="申请原因" required></textarea><button class="btn btn-primary" style="margin-top:8px">提交申请</button></form></div></div></div><div class="col-md-6"><div class="panel panel-default"><div class="panel-heading">提交研究报告</div><div class="panel-body"><form id="report-form"><input name="报告类型" class="form-control" placeholder="报告类型，例如年度报告" required><input name="报告年度" type="number" class="form-control" style="margin-top:8px" required><input name="报告摘要" class="form-control" style="margin-top:8px" placeholder="报告摘要"><textarea name="报告正文" class="form-control" rows="3" style="margin-top:8px" placeholder="报告正文或填写文件路径"></textarea><label style="margin-top:8px"><input name="提交审核" type="checkbox" checked> 提交审核</label><button class="btn btn-primary" style="margin-top:8px">保存报告</button></form></div></div></div></div>
<div class="panel panel-default"><div class="panel-heading">归档材料</div><div class="panel-body"><form id="material-form" class="form-inline"><input name="材料类型" class="form-control" placeholder="材料类型" required><input name="材料标题" class="form-control" placeholder="材料标题" required><input name="文件路径" class="form-control" placeholder="文件路径" required><input name="版本号" type="number" value="1" min="1" class="form-control"><label class="checkbox-inline"><input name="是否必需" type="checkbox"> 必需材料</label><button class="btn btn-default">归档材料</button></form></div></div>
<div class="panel panel-default"><div class="panel-heading">生命周期档案</div><div class="panel-body" id="archive-summary">请输入项目编号后加载。</div><div class="table-responsive"><table class="table table-bordered table-striped" id="archive-table"><thead><tr><th>类别</th><th>名称/类型</th><th>状态</th><th>时间</th><th>说明</th></tr></thead><tbody><tr><td colspan="5">暂无数据</td></tr></tbody></table></div></div>
</div></body></html>
