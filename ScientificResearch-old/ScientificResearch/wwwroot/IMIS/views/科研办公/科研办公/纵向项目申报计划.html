<!DOCTYPE html>
<html lang="zh-CN" style="height:100%"><head><meta charset="UTF-8"><title>纵向项目申报计划</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/IMIS/libs/bootstrap/css/bootstrap.min.css"><link rel="stylesheet" href="/IMIS/css/child_pages.css"><script src="/IMIS/libs/jquery-1.11.1.min.js"></script><script src="/IMIS/libs/bootstrap/js/bootstrap.min.js"></script><script src="/IMIS/js/main.js"></script><script src="/IMIS/js/get_connect/connect_http.js"></script><script src="/IMIS/js/科研办公/科研办公/纵向项目申报计划.js"></script></head>
<body class="page-common" onload="IFrameResize()"><div class="main" style="padding:18px 24px"><div class="clearfix"><h4 class="title pull-left">纵向项目申报计划</h4><a class="btn btn-default pull-right" href="/IMIS/views/科研办公/科研办公/纵向项目申报.html">进入项目申报</a></div><div id="message" class="alert" style="display:none"></div>
<div class="panel panel-default" id="editor" style="display:none"><div class="panel-heading">维护申报计划</div><div class="panel-body"><form id="plan-form" class="form-inline"><input type="hidden" name="编号"><input name="计划年度" type="number" min="2000" max="2200" class="form-control" placeholder="计划年度" required><select name="申报类别" class="form-control"><option value="1">科研项目</option><option value="2">重点学科</option><option value="3">人才培养</option></select><input name="计划名称" class="form-control" style="min-width:220px" placeholder="计划名称" required><input name="发布开始日期" type="date" class="form-control" required><input name="截止日期" type="date" class="form-control" required><select name="状态" class="form-control"><option>草稿</option><option>关闭</option></select><input name="计划说明" class="form-control" style="min-width:260px" placeholder="计划说明"><button class="btn btn-primary">保存</button><button type="button" id="reset" class="btn btn-default">清空</button></form></div></div>
<div class="panel panel-default"><div class="panel-heading">申报窗口</div><div class="table-responsive"><table class="table table-bordered table-striped" id="plans"><thead><tr><th>年度</th><th>类别</th><th>计划名称</th><th>窗口</th><th>状态</th><th>说明</th><th>操作</th></tr></thead><tbody><tr><td colspan="7">加载中…</td></tr></tbody></table></div></div>
