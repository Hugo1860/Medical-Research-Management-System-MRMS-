<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>字段级授权</title><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="/IMIS/libs/bootstrap/css/bootstrap.min.css"><link rel="stylesheet" href="/IMIS/css/child_pages.css"><script src="/IMIS/libs/jquery-1.11.1.min.js"></script><script src="/IMIS/libs/bootstrap/js/bootstrap.min.js"></script><script src="/IMIS/js/main.js"></script><script src="/IMIS/js/get_connect/connect_http.js"></script><script src="/IMIS/js/系统管理/权限管理/字段授权.js"></script></head>
<body onload="IFrameResize()"><div class="page-common" style="padding:18px 24px 36px"><div class="clearfix"><h4 class="title pull-left">字段级授权</h4><a class="btn btn-default btn-sm pull-right" href="/IMIS/views/系统管理/权限管理/角色管理.html">返回角色管理</a></div><div id="message" class="alert" style="display:none"></div>
<div class="panel panel-default"><div class="panel-heading">新增或修改字段规则</div><div class="panel-body"><form id="rule-form" class="form-inline"><select name="角色编号" id="role-select" class="form-control" required><option value="">加载角色…</option></select><input name="资源" class="form-control" placeholder="资源，例如 人员" required><input name="字段" class="form-control" placeholder="字段，例如 手机" required><label class="checkbox-inline"><input name="是否可读" type="checkbox"> 可读</label><label class="checkbox-inline"><input name="是否可写" type="checkbox"> 可写</label><button class="btn btn-primary" type="submit">保存规则</button></form></div></div>
<div class="panel panel-default"><div class="panel-heading clearfix">已配置规则 <button id="refresh" class="btn btn-default btn-sm pull-right">刷新</button></div><div class="table-responsive"><table class="table table-bordered table-striped" id="rules"><thead><tr><th>角色</th><th>资源</th><th>字段</th><th>可读</th><th>可写</th><th>更新时间</th></tr></thead><tbody><tr><td colspan="6">加载中…</td></tr></tbody></table></div></div>
<div class="panel panel-default"><div class="panel-heading">我的权限变更通知</div><div class="panel-body"><button id="notice-refresh" class="btn btn-default btn-sm">刷新通知</button> <button id="notice-read" class="btn btn-success btn-sm">标记当前通知已读</button><ul id="notices" class="list-unstyled" style="margin-top:10px"><li class="text-muted">加载中…</li></ul></div></div></div></body></html>
