<!DOCTYPE html>
<html lang="zh-CN" style="height:100%">
<head>
    <meta charset="UTF-8"><title>科研统计</title><meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/IMIS/libs/bootstrap/css/bootstrap.min.css"><link rel="stylesheet" href="/IMIS/css/child_pages.css">
    <script src="/IMIS/libs/jquery-1.11.1.min.js"></script><script src="/IMIS/libs/bootstrap/js/bootstrap.min.js"></script><script src="/IMIS/js/main.js"></script><script src="/IMIS/js/get_connect/connect_http.js"></script><script src="/IMIS/js/科研统计/科研统计台账.js"></script>
</head>
<style>
    .stats-chart { margin: 16px 0 20px; padding: 14px 16px 10px; border: 1px solid #e5e5e5; border-radius: 4px; background: #fafcff; }
    .stats-chart-title { margin: 0 0 12px; font-weight: 600; color: #4b5563; }
    .stats-chart-item { display: flex; align-items: center; gap: 10px; margin: 9px 0; }
    .stats-chart-label { flex: 0 0 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #374151; }
    .stats-chart-track { flex: 1; height: 18px; overflow: hidden; border-radius: 9px; background: #e8eef7; }
    .stats-chart-bar { height: 100%; min-width: 2px; border-radius: 9px; background: #337ab7; transition: width .25s ease; }
    .stats-chart-value { flex: 0 0 100px; text-align: right; color: #4b5563; font-variant-numeric: tabular-nums; }
    @media (max-width: 600px) { .stats-chart-label { flex-basis: 96px; } .stats-chart-value { flex-basis: 74px; } }
</style>
<body class="page-table page-common" onload="IFrameResize()"><div class="main research-ledger" id="statistics-ledger"><div class="ledger-header clearfix"><h4 class="title pull-left" id="page-title">科研统计</h4><div class="pull-right"><button id="export" class="btn btn-success btn-sm">导出 CSV</button> <a class="btn btn-default btn-sm" href="/IMIS/views/index.html">返回首页</a></div></div><div class="alert alert-info" id="page-description">正在加载统计指标…</div><div class="ledger-links" id="quick-links"></div><div id="statistics-chart" class="stats-chart" role="img" aria-label="统计指标可视化"><p class="stats-chart-title">指标分布</p><p class="text-muted">正在加载…</p></div><div class="panel panel-info"><div class="panel-heading">指标口径管理</div><div class="panel-body"><form id="definition-form" class="form-inline"><input name="指标代码" class="form-control" placeholder="指标代码" required><input name="指标名称" class="form-control" placeholder="指标名称" required><select name="维度" class="form-control"><option>overview</option><option>project</option><option>result</option><option>people</option></select><input name="统计单位" class="form-control" value="条" placeholder="统计单位"><input name="版本号" type="number" min="1" value="1" class="form-control" placeholder="版本号"><select name="状态" class="form-control"><option>草稿</option><option>生效</option><option>停用</option></select><input name="口径说明" class="form-control" style="min-width:320px" placeholder="口径说明" required><button class="btn btn-primary">保存口径</button></form></div><div class="table-responsive"><table class="table table-bordered table-striped table-condensed" id="definition-table"><thead><tr><th>代码</th><th>名称</th><th>维度</th><th>单位</th><th>版本</th><th>状态</th><th>口径说明</th></tr></thead><tbody><tr><td colspan="7">加载中…</td></tr></tbody></table></div></div><div class="table-responsive"><table class="table table-bordered table-striped" id="statistics-table"><thead><tr><th>指标</th><th>数量</th><th>金额/数值</th><th>说明</th><th>操作</th></tr></thead><tbody><tr><td colspan="5" class="text-center text-muted">正在加载…</td></tr></tbody></table></div><div class="panel panel-default" id="drilldown-panel" style="display:none;margin-top:16px"><div class="panel-heading clearfix"><span id="drilldown-title">统计明细</span><button id="drilldown-close" class="btn btn-default btn-xs pull-right">关闭</button></div><div class="panel-body"><p class="text-muted" id="drilldown-definition"></p><div class="table-responsive"><table class="table table-bordered table-condensed" id="drilldown-table"><thead></thead><tbody><tr><td>加载中…</td></tr></tbody></table></div></div></div><p class="text-muted" id="message"></p></div></body></html>
