# HTTP-only template for local or internal testing. Production should use
# nginx-scientificresearch-tls.conf.example after installing a valid certificate.
server {
    listen 80;
    server_name research.example.org;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:63739;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
